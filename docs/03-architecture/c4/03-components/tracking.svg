, "Message Streaming Bus", "Apache Kafka", "Event bus")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="569" x="5" y="447.7188">ContainerDb(ts_db, "Telematics TimeSeries DB", "TimescaleDB", "TSDB")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="436" x="5" y="464.0156">ContainerDb(redis, "In-Memory Cache", "Redis", "Кэш")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="612" x="5" y="480.3125">Container(ws_gw, "Realtime / WebSocket Gateway", "Node.js", "WSS Server")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="577" x="5" y="496.6094">System_Ext(maps, "Map Services", "OSRM / Yandex", "Route / Matrix API")</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="244" x="10" y="512.9063">Function not found System_Ext</text><!--MD5=[91fc5ada857b2cfd7f39683dd9d64880]
@startuml





skinparam defaultTextAlignment center

skinparam wrapWidth 200
skinparam maxMessageSize 150

skinparam rectangle {
    StereotypeFontSize 12
    shadowing false
}

skinparam database {
    StereotypeFontSize 12
    shadowing false
}

skinparam Arrow {
    Color #666666
    FontColor #666666
    FontSize 12
}

skinparam rectangle<<boundary>> {
    Shadowing false
    StereotypeFontSize 0
    FontColor #444444
    BorderColor #444444
    BorderStyle dashed
}






















skinparam rectangle<<person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #08427B
    BorderColor #073B6F
}

skinparam rectangle<<external_person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #686868
    BorderColor #8A8A8A
}

skinparam rectangle<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam rectangle<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}

skinparam database<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam database<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}
















skinparam rectangle<<container>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #438DD5
    BorderColor #3C7FC0
}

skinparam database<<container>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #438DD5
    BorderColor #3C7FC0
}












skinparam rectangle<<component>> {
    StereotypeFontColor #FFFFFF
    FontColor #000000
    BackgroundColor #85BBF0
    BorderColor #78A8D8
}

skinparam database<<component>> {
    StereotypeFontColor #FFFFFF
    FontColor #000000
    BackgroundColor #85BBF0
    BorderColor #78A8D8
}






title Component Diagram - Tracking & Telematics Processor

rectangle "==Tracking & Telematics Processor\n<size:12>[Container]</size>" <<boundary>> as tracking_service {
    rectangle "==GpsPacketDecoder\n//<size:12>[Infrastructure Service]</size>//\n\n Декодирование сырых пакетов телеметрии" <<component>> as gps_packet_decoder
    rectangle "==TelemetryValidator\n//<size:12>[Domain Service]</size>//\n\n Очистка и валидация координат, фильтрация выбросов" <<component>> as telemetry_validator
    rectangle "==KafkaProducer\n//<size:12>[Infrastructure Service]</size>//\n\n Публикация обработанных событий в топики" <<component>> as kafka_producer
    rectangle "==GeofenceEvaluator\n//<size:12>[Domain Service]</size>//\n\n Определение входа/выхода из геозон (Geofencing)" <<component>> as geofence_evaluator
    rectangle "==EtaCalculator\n//<size:12>[Domain Service]</size>//\n\n Расчет ожидаемого времени прибытия (ETA)" <<component>> as eta_calculator
    rectangle "==PositionRedisWriter\n//<size:12>[Infrastructure Service]</size>//\n\n Обновление последней известной позиции в кэше" <<component>> as position_redis_writer
    rectangle "==TimeSeriesHistoryWriter\n//<size:12>[Infrastructure Service]</size>//\n\n Пакетная запись истории в TimeSeries БД" <<component>> as ts_history_writer
    rectangle "==WebSocketBroadcaster\n//<size:12>[Infrastructure Service]</size>//\n\n Отправка уведомлений в Realtime Gateway" <<component>> as ws_broadcaster
}

database "==Message Streaming Bus\n//<size:12>[Apache Kafka]</size>//\n\n Event bus" <<container>> as kafka
database "==Telematics TimeSeries DB\n//<size:12>[TimescaleDB]</size>//\n\n TSDB" <<container>> as ts_db
database "==In-Memory Cache\n//<size:12>[Redis]</size>//\n\n Кэш" <<container>> as redis
rectangle "==Realtime / WebSocket Gateway\n//<size:12>[Node.js]</size>//\n\n WSS Server" <<container>> as ws_gw
System_Ext(maps, "Map Services", "OSRM / Yandex", "Route / Matrix API")

