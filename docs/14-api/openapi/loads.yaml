openapi: 3.1.0
info:
  title: Управление грузами и поиск
  version: 1.0.0
  description: API для управления и поиска грузов
paths:
  /api/v1/loads:
    get:
      summary: Расширенный поиск грузов
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: origin_lat
          in: query
          schema:
            type: number
            format: float
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
    post:
      summary: Публикация нового груза
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
  /api/v1/loads/{id}:
    get:
      summary: Детальная карточка груза
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    put:
      summary: Обновление данных груза
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    delete:
      summary: Отзыв груза с публикации
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
  /api/v1/loads/{id}/reserve:
    post:
      summary: Бронирование груза
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
