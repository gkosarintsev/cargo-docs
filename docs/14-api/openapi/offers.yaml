openapi: 3.1.0
info:
  title: Офферы и встречные предложения
  version: 1.0.0
  description: API для офферов
paths:
  /api/v1/loads/{load_id}/offers:
    get:
      summary: Список откликов по грузу
      parameters:
        - name: load_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    post:
      summary: Подача коммерческого предложения
      parameters:
        - name: load_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
  /api/v1/offers/{id}/counter:
    post:
      summary: Подача встречного предложения
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/offers/{id}/accept:
    post:
      summary: Акцепт оффера
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/offers/{id}/reject:
    post:
      summary: Отклонение оффера
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
