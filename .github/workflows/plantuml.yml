name: Generate PlantUML SVGs

on:
  push:
    paths:
      - '**/*.puml'

jobs:
  render-plantuml:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: Render SVGs
        run: find . -name "*.puml" -exec plantuml -tsvg {} \;

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add **/*.svg
          git commit -m "docs: auto-generate SVG from PlantUML diagrams" || echo "No changes to commit"
          git push
